<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202B35">
<meta name="description" content="Workout Planner & Fitness Tracker — a private, offline workout planner. Plan Better. Train Smarter. Track Your Progress.">
<title>Workout Planner & Fitness Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23202B35'/%3E%3Cpath d='M20 22v20M44 22v20M12 27v10M52 27v10M20 32h24' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F8FA;--primary:#202B35;--secondary:#64748B;--accent:#7C9A83;--accent-d:#4F6F58;--green-l:#E7F0E8;
  --white:#fff;--gray:#EEF1F4;--line:#E2E7EC;--warn:#E7AD62;--warn-d:#8A5A14;--warn-l:#FCF3E4;--danger:#D97777;--danger-d:#A94545;--danger-l:#FBEAEA;
  --r:16px;--r-s:10px;--sh:0 1px 2px rgba(32,43,53,.05),0 4px 14px rgba(32,43,53,.05);
  --font:Inter,"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--primary);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:650}h3{font-size:16px;font-weight:650}h4{font-size:14px;font-weight:650}
p{margin:0 0 8px}
a{color:var(--accent-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7C9A83;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--secondary)}.small{font-size:13px}.xs{font-size:12px}.bold{font-weight:650}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.gap-s{gap:6px}.gap-l{gap:18px}.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}.mb{margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:var(--white);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:var(--primary)}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand b{font-size:14.5px;line-height:1.15;display:block}.brand span{font-size:11px;color:var(--secondary)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--secondary);text-decoration:none;font-weight:550;font-size:14.5px}
.nav a:hover{background:var(--gray);color:var(--primary)}
.nav a[aria-current=page]{background:var(--green-l);color:#2F4A38}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:auto}
.side-foot{margin-top:auto;padding:14px 8px 0;font-size:12px;color:var(--secondary)}
.side-foot button{background:none;border:0;padding:0;color:var(--accent-d);text-decoration:underline;cursor:pointer;font-size:12px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(247,248,250,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid transparent}
.top .t{font-size:13px;color:var(--secondary)}
.saved{font-size:12px;color:var(--secondary);display:flex;align-items:center;gap:5px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
main{padding:6px 28px 90px;max-width:1240px;width:100%;margin:0 auto;outline:none}
.mobile-brand{display:none}
.bottom{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:8px 0 18px}
.page-h p{margin:4px 0 0;color:var(--secondary)}

/* components */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g-dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--white);color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{background:var(--gray)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{background:#2f3d4a}
.btn.acc{background:var(--accent-d);border-color:var(--accent-d);color:#fff}.btn.acc:hover{background:#41604a}
.btn.danger{color:var(--danger-d);border-color:#f0cccc;background:var(--danger-l)}.btn.danger:hover{background:#f7dada}
.btn.dsolid{background:var(--danger-d);border-color:var(--danger-d);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--gray)}
.btn.sm{padding:6px 11px;font-size:13px;min-height:32px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:16px;min-height:48px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--secondary);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--gray);color:var(--primary)}
.icon-btn.fav{color:#C4CAD2}.icon-btn.fav[aria-pressed=true]{color:#D69A3A}.icon-btn.fav[aria-pressed=true] svg{fill:#E7AD62}
.icon-btn.dng:hover{background:var(--danger-l);color:var(--danger-d)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--gray);color:var(--secondary);font-size:12px;font-weight:600;white-space:nowrap}
.chip.g{background:var(--green-l);color:#2F4A38}.chip.w{background:var(--warn-l);color:var(--warn-d)}.chip.r{background:var(--danger-l);color:var(--danger-d)}.chip.d{background:var(--primary);color:#fff}
button.chip{border:1px solid var(--line);background:var(--white);cursor:pointer;padding:6px 13px;font-size:13px}
button.chip:hover{background:var(--gray)}
button.chip[aria-pressed=true]{background:var(--green-l);border-color:var(--accent);color:#2F4A38}
.stat{padding:16px 18px}
.stat .l{font-size:12.5px;color:var(--secondary);font-weight:550;display:flex;align-items:center;gap:6px}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.stat .v small{font-size:14px;font-weight:600;color:var(--secondary);letter-spacing:0}
.stat .s{font-size:12px;color:var(--secondary);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--gray);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.w i{background:var(--warn)}
.empty{text-align:center;padding:28px 16px;color:var(--secondary)}
.empty b{display:block;color:var(--primary);font-size:15px;margin-bottom:4px}
.banner{border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-bottom:14px}
.banner.info{background:var(--green-l);color:#2F4A38}.banner.warn{background:var(--warn-l);color:var(--warn-d)}.banner.err{background:var(--danger-l);color:var(--danger-d)}
.banner .grow{min-width:200px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--secondary);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--gray);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.list>*{border-bottom:1px solid var(--gray)}.list>*:last-child{border-bottom:0}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.li:hover{background:#FAFBFC}
.tabs{display:inline-flex;background:var(--gray);padding:3px;border-radius:11px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--secondary);cursor:pointer}
.tabs button[aria-pressed=true]{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--primary)}
.field{margin-bottom:14px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],select,textarea{width:100%;padding:9px 12px;border:1px solid #D4DAE1;border-radius:10px;background:#fff;min-height:40px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid rgba(124,154,131,.35);outline-offset:0}
input.bad{border-color:var(--danger)}
.hint{font-size:12px;color:var(--secondary);margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fff}
.choice label:hover{background:#FAFBFC}
.choice input{margin-top:3px;accent-color:var(--accent-d)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--green-l)}
.choice label:has(input:focus-visible){outline:3px solid #7C9A83}
.choice small{display:block;color:var(--secondary);font-size:12px;font-weight:400}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.switch input{width:20px;height:20px;accent-color:var(--accent-d)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent-d)}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(20,28,36,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto}
.modal.wide{max-width:760px}.modal.xl{max-width:920px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 6px}
.mb{padding:8px 20px 6px}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px 18px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:480px}
.toast{background:var(--primary);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease;pointer-events:auto}
.toast.err{background:var(--danger-d)}.toast.ok{background:#3E5C48}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* dashboard */
.hero{background:linear-gradient(135deg,#202B35 0%,#33424f 100%);color:#fff;border-radius:20px;padding:24px 26px;display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.hero h1{color:#fff;font-size:28px}.hero p{color:#CBD5DE;margin:6px 0 0}
.hero .chip{background:rgba(255,255,255,.13);color:#fff}
.hero .date{font-size:13px;color:#B8C4CF;text-align:right}
.ring{position:relative;display:inline-grid;place-items:center}
.ring b{position:absolute;font-size:22px}
.today{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.exlist{margin:8px 0 0;padding:0;list-style:none;color:var(--secondary);font-size:13.5px}
.chart{width:100%;min-height:150px}
.chart svg{display:block;max-width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--secondary)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* planner */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.day{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:170px;display:flex;flex-direction:column;gap:9px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,154,131,.25)}
.day.rest{background:#F3F5F7}
.day h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.wk{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FCFDFD}
.wk b{font-size:13.5px;display:block;line-height:1.3}
.wk .acts{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.wk .acts .icon-btn{width:30px;height:30px}
.wk select{min-height:30px;padding:3px 6px;font-size:12px;margin-top:6px}

/* exercise */
.exrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--gray)}
.exrow:last-child{border-bottom:0}
.num{width:26px;height:26px;border-radius:8px;background:var(--gray);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--secondary)}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini label{font-size:11.5px;color:var(--secondary);display:block;font-weight:600}
.mini input{width:84px;min-height:34px;padding:5px 8px}
.exc{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.exc h3{font-size:15.5px}
.exc .meta{display:flex;gap:6px;flex-wrap:wrap}
.detail dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--secondary);font-weight:700;margin-top:12px}
.detail dd{margin:3px 0 0}

/* session */
.sess-head{position:sticky;top:57px;z-index:15;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh)}
.set{display:grid;grid-template-columns:44px repeat(2,minmax(0,1fr)) 44px 36px;gap:8px;align-items:center;margin-top:7px}
.set.one{grid-template-columns:44px minmax(0,1fr) 44px 36px}
.set .sl{font-size:12.5px;color:var(--secondary);font-weight:700}
.set input[type=number]{min-height:42px;text-align:center}
.set .ud{position:relative}
.set .ud span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--secondary);pointer-events:none}
.set .ud input{padding-right:30px}
.setchk{width:40px;height:40px;border-radius:11px;border:1.5px solid #CBD3DB;background:#fff;color:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.setchk[aria-pressed=true]{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.exc.skipped{opacity:.55}
.exc.allsets{border-color:var(--accent);background:#FBFDFB}
.sethead{display:grid;grid-template-columns:44px repeat(2,minmax(0,1fr)) 44px 36px;gap:8px;font-size:11px;color:var(--secondary);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.sethead.one{grid-template-columns:44px minmax(0,1fr) 44px 36px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--primary);color:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock .tt{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:64px}
.dock .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;min-height:36px;padding:6px 12px}
.dock .btn:hover{background:rgba(255,255,255,.22)}
.dock small{color:#B8C4CF}
.tbig{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--secondary);font-weight:700;text-align:center;padding:4px 0}
.cd{position:relative;border:1px solid var(--line);background:#fff;border-radius:11px;min-height:78px;padding:6px 7px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cd:hover{border-color:var(--accent)}
.cd.out{background:#F6F7F9;color:#9AA5B1}
.cd.today{box-shadow:0 0 0 2px var(--accent)}
.cd.sel{background:var(--green-l)}
.cd .n{font-size:13px;font-weight:650}
.tag{font-size:11px;font-weight:650;padding:1px 6px;border-radius:6px;display:inline-block;line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.done{background:var(--accent-d);color:#fff}.tag.sch{background:#fff;border:1px solid var(--accent);color:var(--accent-d)}.tag.rest{background:var(--gray);color:var(--secondary)}.tag.miss{background:var(--warn-l);color:var(--warn-d);border:1px solid var(--warn)}.tag.ms{background:#FFF4D6;color:#7A5A00}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--secondary)}

/* welcome */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{max-width:760px;width:100%}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:48px;height:44px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:650;cursor:pointer}
.daypick button[aria-pressed=true]{background:var(--green-l);border-color:var(--accent);color:#2F4A38}
.disc{font-size:12.5px;color:var(--secondary);background:var(--gray);border-radius:12px;padding:12px 14px}

.print-only{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash{grid-template-columns:1fr}}
@media(max-width:900px){
  .side{display:none}
  .top{padding:10px 14px}
  .mobile-brand{display:flex;align-items:center;gap:8px;font-weight:700}
  .mobile-brand .logo{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
  .top .t.desk{display:none}
  main{padding:4px 14px 110px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--secondary);text-decoration:none;padding:5px 2px;background:none;border:0;cursor:pointer;border-radius:10px}
  .bottom [aria-current=page]{color:#2F4A38;background:var(--green-l)}
  .dock{bottom:76px;width:calc(100% - 24px);max-width:460px;justify-content:space-between}
  #toasts{bottom:150px}
  .sess-head{top:50px}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .g3,.g2{grid-template-columns:1fr}
  .g-auto{grid-template-columns:1fr}
  .fgrid,.fgrid.c3{grid-template-columns:1fr}
  .hero{padding:18px}.hero h1{font-size:23px}.hero .date{text-align:left}
  .cd{min-height:58px;padding:4px}
  .cd .tag{font-size:0;padding:0;width:9px;height:9px;border-radius:50%;line-height:0}
  .cd .tags{display:flex;gap:3px;flex-wrap:wrap}
  .tag.done{background:var(--accent-d)}.tag.sch{border:2px solid var(--accent)}.tag.miss{background:var(--warn)}.tag.rest{background:#B7C0CA}.tag.ms{background:#E7AD62}
  .page-h h1{font-size:22px}
  .modal{border-radius:16px}.overlay{padding:2vh 8px}
}

/* ===== Static data: exercise library, templates, labels ===== */
const MUSCLES=['Chest','Back','Shoulders','Arms','Legs','Core','Cardio','Mobility'];
const WORKOUT_MUSCLES=['Full Body'].concat(MUSCLES);
const EQUIP={none:'No equipment',dumbbells:'Dumbbells',bands:'Resistance bands',barbell:'Barbell',kettlebells:'Kettlebells',machines:'Gym machines',other:'Bench / bar / other'};
const PROFILE_EQUIP={none:'No equipment',dumbbells:'Dumbbells',bands:'Resistance bands',barbell:'Barbell',kettlebells:'Kettlebells',machines:'Gym machines',full:'Full gym equipment'};
const DIFFS={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced'};
const TYPES={strength:'Strength (weight × reps)',bodyweight:'Bodyweight (reps)',timed:'Timed (seconds)',cardio:'Cardio (minutes / distance)'};
const GOALS={general:'General fitness',strength:'Strength development',muscle:'Muscle building',weight:'Weight management',cardio:'Cardiovascular fitness',mobility:'Flexibility and mobility',consistency:'Workout consistency'};
const LOCS={home:'Home',gym:'Gym',outdoors:'Outdoors'};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYS3=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function E(id,name,muscle,sec,equip,diff,type,how,safe,mist){return {id,name,muscle,sec,equip,diff,type,how,safe,mist}}
const LIB=[
/* Chest */
E('pushups','Push-ups','Chest',['Triceps','Shoulders','Core'],['none'],'beginner','bodyweight','Start in a high plank with hands just wider than your shoulders and your body in one straight line. Lower your chest toward the floor with elbows angled about 45 degrees, then press back up.','If the floor version is too hard, place your hands on a wall or sturdy bench. Stop a rep or two before your form breaks down.','Sagging hips, flaring the elbows straight out to the sides, and cutting the range of motion short.'),
E('bench-press','Bench Press','Chest',['Triceps','Shoulders'],['barbell','other'],'intermediate','strength','Lie on a flat bench with your eyes under the bar, feet planted and shoulder blades pulled together. Lower the bar to mid-chest under control, then press it back up over your shoulders.','Use safety arms or a spotter for heavy sets, and wrap your thumbs around the bar.','Bouncing the bar off the chest, lifting the hips off the bench, and letting the wrists bend back.'),
E('incline-db-press','Incline Dumbbell Press','Chest',['Shoulders','Triceps'],['dumbbells','other'],'intermediate','strength','Set a bench to a low incline and hold a dumbbell in each hand at chest level. Press the weights up until your arms are straight, then lower them slowly to the start.','Keep the incline modest and pick a weight you can control for every rep.','Setting the bench too steep, flaring the elbows, and letting the dumbbells drift apart.'),
E('chest-fly','Chest Fly','Chest',['Shoulders'],['dumbbells','other'],'intermediate','strength','Lie on a bench with dumbbells above your chest and a soft bend in your elbows. Open your arms in a wide arc until you feel a comfortable stretch across the chest, then bring the weights back together.','Use light weights and keep the elbow bend fixed throughout.','Going too heavy, lowering the weights too far, and turning the move into a press.'),
E('cable-crossover','Cable Crossover','Chest',['Shoulders'],['machines'],'intermediate','strength','Set the pulleys high and hold a handle in each hand. Step forward with a slight lean and bring your hands together in front of your hips in a wide arc, then return slowly.','Keep your feet staggered for balance and avoid jerking the cables.','Using momentum, rounding the shoulders forward, and bending the elbows more on each rep.'),
E('db-bench-press','Dumbbell Bench Press','Chest',['Triceps','Shoulders'],['dumbbells','other'],'beginner','strength','Lie on a bench with a dumbbell in each hand at chest level. Press them up until your arms are straight, then lower them with control until your elbows are just below the bench.','If you train alone, choose a weight you can lower to the floor safely if you need to stop.','Letting the wrists bend, bouncing at the bottom, and pressing the dumbbells too far forward.'),
/* Back */
E('pullups','Pull-ups','Back',['Biceps','Core'],['other'],'intermediate','bodyweight','Hang from a bar with an overhand grip a little wider than your shoulders. Pull your chest toward the bar by driving your elbows down, then lower yourself until your arms are straight.','Use an assisted version or a resistance band if you cannot complete full reps yet.','Swinging or kipping, only moving halfway, and shrugging the shoulders up to the ears.'),
E('lat-pulldown','Lat Pulldown','Back',['Biceps'],['machines'],'beginner','strength','Sit with your thighs secured under the pad and grip the bar slightly wider than your shoulders. Pull the bar down to your upper chest while keeping your chest tall, then let it rise slowly.','Select a weight that lets you keep your torso steady rather than leaning back.','Pulling the bar behind the neck, swinging the torso, and letting the weight yank your arms up.'),
E('seated-row','Seated Cable Row','Back',['Biceps','Shoulders'],['machines'],'beginner','strength','Sit tall with your feet braced and knees slightly bent, holding the handle with arms extended. Pull the handle toward your lower ribs, squeeze your shoulder blades together, then return slowly.','Keep your back neutral and avoid rocking to start the movement.','Rounding the lower back, shrugging, and using body swing to move the weight.'),
E('bent-over-row','Bent-over Row','Back',['Biceps','Hamstrings','Core'],['barbell'],'intermediate','strength','Hinge forward at the hips with a flat back and the bar hanging below your shoulders. Pull the bar toward your lower ribs, pause briefly, and lower it under control.','Keep your spine neutral and choose a weight that lets you hold the hinge position.','Rounding the back, standing up as you pull, and jerking the bar with momentum.'),
E('sa-db-row','Single-arm Dumbbell Row','Back',['Biceps'],['dumbbells','other'],'beginner','strength','Place one hand and knee on a bench, or one hand on a sturdy surface, with a flat back. Pull the dumbbell toward your hip, then lower it until your arm is straight. Complete all reps, then switch sides.','Keep your hips and shoulders square to the floor.','Twisting the torso, lifting with the wrist instead of the back, and rushing the lowering phase.'),
E('band-pull-apart','Band Pull-Apart','Back',['Shoulders'],['bands'],'beginner','bodyweight','Hold a light resistance band in front of you at chest height with straight arms. Pull the band apart by squeezing your shoulder blades together, then return slowly.','Use a light band and keep your ribs down rather than arching your back.','Shrugging the shoulders and letting the elbows bend more with each rep.'),
E('deadlift','Deadlift','Back',['Glutes','Hamstrings','Core'],['barbell'],'advanced','strength','Stand with the bar over mid-foot, hinge at the hips and grip the bar just outside your legs. Brace your core, push the floor away and stand tall, then lower the bar by hinging back and bending the knees.','Learn the movement with light weights first and keep the bar close to your legs.','Rounding the back, jerking the bar off the floor, and letting it drift away from the body.'),
/* Shoulders */
E('shoulder-press','Shoulder Press','Shoulders',['Triceps','Core'],['dumbbells','barbell'],'intermediate','strength','Hold the weights at shoulder height with your core tight. Press overhead until your arms are straight, then lower slowly back to your shoulders.','Avoid arching your lower back; reduce the weight if you cannot keep your ribs down.','Leaning back to push the weight up, flaring the elbows too wide, and incomplete lockout.'),
E('lateral-raise','Lateral Raises','Shoulders',[],['dumbbells'],'beginner','strength','Stand with a light dumbbell in each hand at your sides. Raise your arms out to the sides until they reach shoulder height, then lower slowly.','Use light weights; heavy loads usually lead to shrugging and swinging.','Swinging the weights up, raising the arms above shoulder height, and shrugging.'),
E('front-raise','Front Raises','Shoulders',['Chest'],['dumbbells'],'beginner','strength','Hold light dumbbells in front of your thighs. Raise one or both arms straight in front of you to shoulder height, then lower with control.','Keep your torso still and choose a weight you can lift without leaning back.','Using momentum, lifting above shoulder height, and arching the lower back.'),
E('rear-delt-fly','Rear Delt Fly','Shoulders',['Back'],['dumbbells'],'intermediate','strength','Hinge forward with a flat back and light dumbbells hanging below your chest. Raise your arms out to the sides, squeezing your shoulder blades gently, then lower slowly.','Go light and keep your neck relaxed and in line with your spine.','Using heavy weights, shrugging, and swinging the torso.'),
/* Arms */
E('bicep-curl','Bicep Curls','Arms',['Forearms'],['dumbbells'],'beginner','strength','Stand with a dumbbell in each hand and your elbows by your sides. Curl the weights up toward your shoulders without moving your elbows, then lower them slowly.','Keep your wrists straight and avoid leaning back.','Swinging the body, letting the elbows drift forward, and dropping the weight quickly.'),
E('hammer-curl','Hammer Curls','Arms',['Forearms'],['dumbbells'],'beginner','strength','Hold the dumbbells with palms facing each other. Curl them up toward your shoulders keeping the same grip, then lower with control.','Keep your elbows close to your torso.','Using momentum and shrugging the shoulders.'),
E('tricep-pushdown','Tricep Pushdowns','Arms',[],['machines'],'beginner','strength','Stand at a cable station holding the bar or rope with your elbows tucked at your sides. Press the handle down until your arms are straight, then let it rise until your forearms are about parallel to the floor.','Keep your elbows pinned in place and your torso upright.','Letting the elbows flare out, leaning over the weight, and using body swing.'),
E('tricep-extension','Tricep Extensions','Arms',['Shoulders'],['dumbbells'],'beginner','strength','Hold one dumbbell with both hands overhead. Bend your elbows to lower the weight behind your head, then straighten your arms to return.','Use a light weight and keep your core braced so your back does not arch.','Flaring the elbows, arching the lower back, and lowering the weight too quickly.'),
/* Legs */
E('squats','Squats','Legs',['Glutes','Core'],['none','dumbbells','barbell'],'beginner','strength','Stand with feet about shoulder-width apart. Sit your hips back and down while keeping your chest up, then drive through your feet to stand. Leave the weight blank for bodyweight squats.','Keep your knees tracking in line with your toes and use a range of motion that feels comfortable.','Letting the knees cave inward, lifting the heels, and rounding the lower back.'),
E('lunges','Lunges','Legs',['Glutes','Core'],['none','dumbbells'],'beginner','strength','Step forward into a long stride and lower until both knees are bent at roughly 90 degrees. Push through the front foot to return to standing, then repeat on the other side. Count reps per leg.','Hold a wall or chair for balance if needed, and keep the front knee over the middle of the foot.','Taking too short a step, letting the front knee collapse inward, and leaning the torso forward.'),
E('leg-press','Leg Press','Legs',['Glutes'],['machines'],'beginner','strength','Sit with your back flat against the pad and feet shoulder-width on the platform. Lower the platform until your knees are comfortably bent, then press back up without locking out your knees.','Never lock the knees hard at the top and keep your lower back and hips on the seat.','Lowering too far so the hips lift, locking out forcefully, and letting the knees cave in.'),
E('rdl','Romanian Deadlift','Legs',['Glutes','Back'],['barbell','dumbbells'],'intermediate','strength','Stand holding the weight in front of your thighs. Push your hips back with soft knees and slide the weight down your legs until you feel a hamstring stretch, then drive the hips forward to stand.','Keep your back flat and the weight close to your body; stop lowering when your form changes.','Rounding the back, bending the knees too much, and letting the weight drift away from the legs.'),
E('leg-curl','Leg Curl','Legs',[],['machines'],'beginner','strength','Adjust the machine so the pad rests just above your heels. Curl your heels toward your glutes, pause briefly, and return slowly.','Use a controlled tempo and avoid lifting your hips off the pad.','Using momentum, lifting the hips, and dropping the weight on the way back.'),

    active:null,timer:{status:'idle',total:60,endsAt:0,remain:60}

function normalize(st){
  const b=blankState(), o=Object.assign({},b,st), s=st.settings||{};
  o.meta=Object.assign({},b.meta,st.meta||{});o.profile=Object.assign({},b.profile,st.profile||{});
  o.settings=Object.assign({},b.settings,s);o.settings.units=Object.assign({},b.settings.units,s.units||{});o.settings.tracked=Object.assign({},b.settings.tracked,s.tracked||{});
  o.timer=Object.assign({},b.timer,st.timer||{});
  ['customEx','fav','plan','templates','sessions','progress','goals','challenges'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  if(!Array.isArray(o.restDays)||o.restDays.length!==7)o.restDays=b.restDays.slice();
  if(!Array.isArray(o.profile.days))o.profile.days=b.profile.days.slice();

/* ---------- local storage layer (IndexedDB + localStorage mirror) ---------- */
let NS='',MODE='auth';const SK=()=>'state:'+NS,LK=()=>'wpft-state:'+NS;
const DB={db:null,mode:'memory',
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));
    let r;try{r=indexedDB.open('wpft-db',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IDB error'));r.onblocked=()=>rej(new Error('IDB blocked'));
    setTimeout(()=>rej(new Error('IDB timeout')),4000);
  })},
  get(k){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  del(k){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  lsGet(){try{const t=localStorage.getItem(LK());return t?JSON.parse(t):null}catch(e){return null}},
  async init(){try{this.db=await this.open();this.mode='idb'}catch(e){this.db=null;try{localStorage.setItem('wpft-test','1');localStorage.removeItem('wpft-test');this.mode='ls'}catch(e2){this.mode='memory'}}},
  async load(){
    let a=null;if(this.db){try{a=await this.get(SK())}catch(e){a=null}}
    const b=this.lsGet();
    const pick=(a&&b)?((b.meta&&b.meta.saved||0)>(a.meta&&a.meta.saved||0)?b:a):(a||b);
    return pick&&typeof pick==='object'?pick:null;
  }
};
let saveT=null;
function save(){
  if(!S||MODE==='auth')return;S.meta.saved=Date.now();if(MODE==='demo'){setSaved('saved');return}setSaved('saving');
  clearTimeout(saveT);saveT=setTimeout(flush,200);
}
async function flush(){
  if(!S||MODE!=='user')return;clearTimeout(saveT);saveT=null;let ok=false;
  try{if(DB.db){await DB.put(SK(),S);ok=true}}catch(e){console.warn('IDB save failed',e)}
  try{localStorage.setItem(LK(),JSON.stringify(S));ok=true}catch(e){/* quota or blocked */}
  setSaved(ok?'saved':'error');
}
function flushSync(){ // last-chance synchronous mirror (page closing)
  if(!S||!saveT||MODE!=='user')return;try{localStorage.setItem(LK(),JSON.stringify(S))}catch(e){}flush();
}
function setSaved(st){
  const el=$('#saved');if(!el)return;
  if(MODE==='demo'){el.innerHTML='<i style="background:#E7AD62"></i>Demo · not saved';return}
  el.innerHTML=st==='saving'?'<i style="background:#E7AD62"></i>Saving…':st==='error'?'<i style="background:#D97777"></i>Not saved – export a backup':'<i></i>Saved on this device';
}
window.addEventListener('pagehide',flushSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSync();else syncFromStorage()});
async function syncFromStorage(){ // pick up changes made in another tab
  try{if(!S||saveT||MODE!=='user')return;const st=await DB.load();if(st&&st.meta&&st.meta.saved>S.meta.saved){S=normalize(st);render(true)}}catch(e){}
}

/* ---------- units ---------- */
const KG2LB=2.20462262185,CM2IN=0.3937007874,KM2MI=0.6213711922;
function uName(k){const u=S.settings.units;return k==='w'?u.w:k==='l'?u.l:k==='d'?u.d:({reps:'reps',sec:'sec',min:'min'}[k]||'')}
function toDisp(k,v){if(v==null||v==='')return null;v=+v;const u=S.settings.units;
  if(k==='w'&&u.w==='lb')return v*KG2LB;if(k==='l'&&u.l==='in')return v*CM2IN;if(k==='d'&&u.d==='mi')return v*KM2MI;return v}
function fromDisp(k,v){if(v==null||v==='')return null;v=+v;const u=S.settings.units;let r=v;
  if(k==='w'&&u.w==='lb')r=v/KG2LB;else if(k==='l'&&u.l==='in')r=v/CM2IN;else if(k==='d'&&u.d==='mi')r=v/KM2MI;
  return Math.round(r*10000)/10000}
const fmtNum=(v,dp=1)=>v==null||isNaN(v)?'–':String(+(+v).toFixed(dp));
function inVal(k,v){const d=toDisp(k,v);return d==null?'':String(+d.toFixed(2))}           // value for an <input>
function fmtU(k,v,dp=1){const d=toDisp(k,v);return d==null?'–':fmtNum(d,dp)+' '+uName(k)}   // "12.5 kg"
function fmtSecs(s){s=Math.round(+s||0);return s<60?s+'s':Math.floor(s/60)+'m'+(s%60?' '+pad(s%60)+'s':'')}
function fmtMin(m){m=Math.round(+m||0);return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+pad(m%60)+'m':'')}
function fmtClock(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)}
function fmtMetric(key,v){const m=METRICS[key];if(v==null)return '–';
  if(m.u==='sec')return fmtSecs(v);if(m.u==='min')return fmtNum(v,1)+' min';if(m.u==='reps')return fmtNum(v,0)+' reps';return fmtU(m.u,v,m.u==='d'?2:1)}
function metricUnitLabel(key){const m=METRICS[key];return m.u==='sec'?'seconds':m.u==='min'?'minutes':m.u==='reps'?'reps':uName(m.u)}
function metricToDisp(key,v){const m=METRICS[key];return (m.u==='w'||m.u==='l'||m.u==='d')?toDisp(m.u,v):v}
function metricFromDisp(key,v){const m=METRICS[key];return (m.u==='w'||m.u==='l'||m.u==='d')?fromDisp(m.u,v):v}

const MODALS=[];
function modal(o){

  const prev=document.activeElement;

}

    const f=$$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',ov).filter(x=>x.offsetParent!==null);

function sessStats(ss){
  let sets=0,reps=0,vol=0,exs=0;

/* ----- personal records ----- */
function computePRs(){
  const list=S.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.startedAt||0)-(b.startedAt||0));
  const best={},events=[];
  for(const s of list)for(const e of s.exercises){
    if(e.skipped)continue;const ds=e.sets.filter(x=>x.done);if(!ds.length)continue;let rec=null;
    if(e.type==='strength'){
      const hv=ds.filter(x=>x.w>0);
      if(hv.length){const b=hv.reduce((m,x)=>(x.w>m.w||(x.w===m.w&&(x.reps||0)>(m.reps||0)))?x:m,hv[0]);rec={score:b.w,text:fmtU('w',b.w)+' × '+(b.reps||0),kind:'weight'}}
      else{const b=Math.max(...ds.map(x=>+x.reps||0));rec={score:b,text:b+' reps',kind:'reps'}}
    }else if(e.type==='bodyweight'){const b=Math.max(...ds.map(x=>+x.reps||0));rec={score:b,text:b+' reps',kind:'reps'}}
    else if(e.type==='timed'){const b=Math.max(...ds.map(x=>+x.dur||0));rec={score:b,text:fmtSecs(b),kind:'time'}}
    else{const dd=Math.max(...ds.map(x=>+x.dist||0));if(dd>0)rec={score:dd,text:fmtU('d',dd,2),kind:'dist'};else{const b=Math.max(...ds.map(x=>+x.dur||0));rec={score:b,text:fmtMin(b/60),kind:'time'}}}
    if(!rec||!(rec.score>0))continue;
    const prev=best[e.exId];
    const better=!prev||(rec.kind===prev.kind&&rec.score>prev.score)||(prev.kind==='reps'&&rec.kind==='weight');
    if(better){
      best[e.exId]=Object.assign({exId:e.exId,name:e.name,date:s.date,sessionId:s.id},rec);
      if(prev)events.push(Object.assign({},best[e.exId]));
    }
  }
  return {best,events};
}

  const t=today(),firstS=S.sessions.length?S.sessions[0].date:t,minD=firstS<S.profile.start?firstS:S.profile.start;

  Object.keys(seen).forEach(d=>m.push({date:d,text:seen[d]===1?'New personal record':seen[d]+' new personal records'}));
  S.goals.forEach(g=>{if(g.completed&&g.completedOn)m.push({date:g.completedOn,text:'Goal reached: '+g.title})});

/* ----- goals / challenges ----- */
function goalProgress(g){
  const t=today();let pct=0,label='',reached=false;
  if(g.type==='weekly'){const w=weekRange(t),c=sessionsBetween(w.start,w.end).length;pct=c/g.target*100;label=c+' of '+g.target+' workouts this week';
    // weeks met since creation
    let met=0,tot=0,ws=startOfWeek(g.created||S.profile.start);while(ws<startOfWeek(t)){tot++;if(sessionsBetween(ws,addDays(ws,6)).length>=g.target)met++;ws=addDays(ws,7)}
    if(tot)label+=' · met in '+met+' of '+tot+' earlier weeks'}
  else if(g.type==='monthly'){const c=sessionsBetween(monthStart(t),monthEnd(t)).length;pct=c/g.target*100;label=c+' of '+g.target+' workouts this month'}
  else if(g.type==='minutes'){const w=weekRange(t);let c=0;for(let i=0;i<7;i++){const k=addDays(w.start,i);if(minutesOf(sessionsOn(k))>=g.target)c++}
    const need=g.days||7;pct=c/need*100;label=c+' of '+need+' days this week with '+g.target+'+ minutes'}
  else if(g.type==='total'){const c=S.sessions.filter(s=>s.date>=(g.created||'0000')).length;pct=c/g.target*100;label=c+' of '+g.target+' workouts since you set this goal'}
  else if(g.type==='streak'){const c=currentStreak();pct=c/g.target*100;label='Current streak: '+c+' of '+g.target+' workout days'}
  else if(g.type==='metric'){
    const m=METRICS[g.metric],ent=metricEntries(g.metric),cur=ent.length?ent[ent.length-1].value:null,s=g.start!=null?g.start:(ent.length?ent[0].value:0);
    if(cur==null){pct=0;label='No entries yet for '+m.label.toLowerCase()}
    else{pct=g.target===s?(cur>=g.target?100:0):(cur-s)/(g.target-s)*100;label='Now '+fmtMetric(g.metric,cur)+' · target '+fmtMetric(g.metric,g.target)}
  }else{pct=(g.current||0)/g.target*100;label=(g.current||0)+' of '+g.target+(g.unit?' '+g.unit:'')}

function challengeProgress(c){
  const t=today(),end=addDays(c.start,c.days-1);let active=0;const cells=[];
  for(let i=0;i<c.days;i++){const k=addDays(c.start,i),done=sessionsOn(k).length>0;if(done)active++;
    cells.push({k,done,today:k===t,future:k>t,missed:k<t&&!done})}
  const pct=clamp(active/c.target*100,0,100);
  const state=c.completedOn||active>=c.target?'completed':t>end?'ended':t<c.start?'upcoming':'active';

function estimateMin(exs){

    if(ex.type==='cardio')s+=(+e.dur||600)*n;else if(ex.type==='timed')s+=((+e.dur||30)+(+e.rest||30))*n;else s+=(45+(+e.rest||60))*n}

function buildSession(src,date){

    const ex=getEx(pe.exId),last=lastPerf(pe.exId),sets=[];

      let w=null;if(ex.type==='strength')w=pe.weight!=null?pe.weight:(ls&&ls.w>0?ls.w:null);
      sets.push({w,reps:isRepsType(ex.type)?(pe.reps||null):null,dur:(ex.type==='timed'||ex.type==='cardio')?(pe.dur||null):null,dist:ex.type==='cardio'?(pe.dist||null):null,done:false});

  });

function matchEquip(ex){
  const eq=new Set(S.profile.equip);if(eq.has('full'))return true;
  if(ex.equip.includes('none'))return true;
  const need=ex.equip.filter(x=>x!=='other');
  if(need.length)return need.some(x=>x==='machines'?eq.has('machines'):eq.has(x));
  return eq.has('machines');
}

/* ===== Backup / restore ===== */
function backupObj(){return {app:APP_ID,version:APP_VERSION,exportedAt:new Date().toISOString(),data:S}}
function validateBackup(o){
  if(!o||typeof o!=='object'||o.app!==APP_ID||!o.data||typeof o.data!=='object')return {ok:false,error:'This file is not a Workout Planner & Fitness Tracker backup (.json).'};
  const d=o.data;
  for(const k of ['sessions','plan','progress','goals','templates','customEx','challenges','fav']){if(d[k]!==undefined&&!Array.isArray(d[k]))return {ok:false,error:'The backup file looks damaged (invalid "'+k+'" section).'}}
  const dateOk=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
  const st=normalize(d);
  st.sessions=st.sessions.filter(s=>s&&dateOk(s.date)&&Array.isArray(s.exercises));
  st.progress=st.progress.filter(p=>p&&dateOk(p.date)&&METRICS[p.metric]&&isFinite(+p.value));
  st.plan=st.plan.filter(w=>w&&Array.isArray(w.exercises));
  st.templates=st.templates.filter(w=>w&&Array.isArray(w.exercises));
  st.meta.onboarded=!!st.meta.onboarded;
  if(!st.meta.onboarded&&(st.sessions.length||st.plan.length))st.meta.onboarded=true;
  return {ok:true,state:st};
}

let DRAFT=null;
function initDraft(kind,id,day){
  const key=kind+':'+id+':'+(day==null?'':day);
  if(DRAFT&&DRAFT.key===key)return true;
  let data;
  if(id==='new'){data=newWorkoutObj({day:day!=null&&day!==''?+day:null});if(kind==='template'){data.level='Beginner'}}
  else{const src=(kind==='workout'?S.plan:S.templates).find(x=>x.id===id);if(!src)return false;data=clone(src)}
  DRAFT={kind,id,key,data,isNew:id==='new'};return true;
}
ROUTES.edit=args=>{
  const kind=args[0]==='template'?'template':'workout';
  if(!initDraft(kind,args[1]||'new',args[2])){toast('That workout could not be found.','err');setTimeout(()=>go(kind==='template'?'templates':'planner'),0);return null}
  const d=DRAFT.data,isT=kind==='template',est=estimateMin(d.exercises);
  let h=pageHead((DRAFT.isNew?'New ':'Edit ')+(isT?'template':'workout'),'Changes are saved when you press Save.','<button type="button" class="btn" data-act="cancelDraft">Cancel</button><button type="button" class="btn pri" data-act="saveDraft">'+ic('check')+'Save '+(isT?'template':'workout')+'</button>');

   +'<div class="field"><label class="f" for="d-name">Name</label><input id="d-name" type="text" data-inp="dfield" data-f="name" maxlength="80" value="'+esc(d.name)+'" placeholder="e.g. Upper Body Workout" required></div>'
   +(isT?'<div class="field"><label class="f" for="d-level">Level</label><select id="d-level" data-chg="dfieldc" data-f="level">'+['Beginner','Intermediate','Advanced','Any'].map(l=>'<option'+(d.level===l?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'
     :'<div class="field"><label class="f" for="d-day">Workout day</label><select id="d-day" data-chg="dfieldc" data-f="day"><option value="">Unscheduled</option>'+DAYS.map((x,i)=>'<option value="'+i+'"'+(d.day===i?' selected':'')+'>'+x+'</option>').join('')+'</select></div>')
   +'<div class="field"><label class="f" for="d-dur">Duration (minutes)</label><input id="d-dur" type="number" min="5" max="300" step="5" inputmode="numeric" data-inp="dfield" data-f="duration" value="'+esc(d.duration||'')+'"><div class="hint">Estimated from your exercises: ~'+est+' min · <button type="button" class="lnk" style="color:var(--accent-d);text-decoration:underline" data-act="useEst">use estimate</button></div></div>'
   +'<div class="field"><label class="f" id="mg-l">Muscle groups</label><div class="row wrap gap-s" role="group" aria-labelledby="mg-l">'+WORKOUT_MUSCLES.map(m=>'<button type="button" class="chip" data-act="dMuscle" data-m="'+m+'" aria-pressed="'+d.muscles.includes(m)+'">'+m+'</button>').join('')+'</div></div></div>'
   +'<div class="field"><label class="f" for="d-notes">Notes</label><textarea id="d-notes" data-inp="dfield" data-f="notes" maxlength="500" placeholder="Optional: cues, equipment, reminders">'+esc(d.notes)+'</textarea></div>'
   +(DRAFT.isNew&&!d.exercises.length&&S.templates.length?'<div class="field"><label class="f" for="d-tpl">Start from a template</label><select id="d-tpl" data-chg="loadTpl"><option value="">Choose a template (optional)…</option>'+S.templates.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div>':'')
   +'</div>';
  h+='<div class="card mt"><div class="row between wrap"><h2>Exercises <span class="muted small">('+d.exercises.length+')</span></h2><button type="button" class="btn" data-act="addEx">'+ic('plus')+'Add exercises</button></div>';
  if(!d.exercises.length)h+=emptyState('No exercises yet','Add exercises from the library to build this '+(isT?'template':'workout')+'.','<button type="button" class="btn pri" data-act="addEx">'+ic('plus')+'Add exercises</button>');
  else h+=d.exercises.map((e,i)=>exRowEdit(e,i,d.exercises.length)).join('');
  h+='</div><div class="row mt wrap" style="justify-content:flex-end"><button type="button" class="btn" data-act="cancelDraft">Cancel</button><button type="button" class="btn pri" data-act="saveDraft">'+ic('check')+'Save '+(isT?'template':'workout')+'</button></div>';
  h+='<p class="small muted mt">'+(isT?'Templates are general fitness examples, not individualized medical or professional training prescriptions.':'Choose exercises that suit your ability. Stop if you feel pain or dizziness.')+'</p>';
  return h;
};
function exRowEdit(e,i,n){
  const ex=getEx(e.exId),t=ex.type,inp=(f,lab,val,extra)=>'<div><label for="x'+i+f+'">'+lab+'</label><input id="x'+i+f+'" type="number" inputmode="decimal" step="any" min="0" data-inp="dx" data-i="'+i+'" data-f="'+f+'" value="'+esc(val)+'" '+(extra||'')+'></div>';
  let f='';
  if(t==='strength')f=inp('sets','Sets',e.sets,'step="1" min="1"')+inp('reps','Reps',e.reps==null?'':e.reps,'step="1"')+inp('weight','Weight ('+uName('w')+')',inVal('w',e.weight))+inp('rest','Rest (s)',e.rest==null?'':e.rest,'step="5"');
  else if(t==='bodyweight')f=inp('sets','Sets',e.sets,'step="1" min="1"')+inp('reps','Reps',e.reps==null?'':e.reps,'step="1"')+inp('rest','Rest (s)',e.rest==null?'':e.rest,'step="5"');
  else if(t==='timed')f=inp('sets','Sets',e.sets,'step="1" min="1"')+inp('dur','Seconds',e.dur==null?'':e.dur,'step="5"')+inp('rest','Rest (s)',e.rest==null?'':e.rest,'step="5"');
  else f=inp('dur','Minutes',e.dur==null?'':+(e.dur/60).toFixed(1))+inp('dist','Distance ('+uName('d')+')',inVal('d',e.dist));
  return '<div class="exrow"><span class="num">'+(i+1)+'</span><div><b>'+esc(ex.name)+'</b> <span class="chip">'+esc(ex.muscle)+'</span><div class="mini">'+f+'</div></div>'
    +'<div class="row" style="gap:0"><button type="button" class="icon-btn" data-act="dxMove" data-i="'+i+'" data-dir="-1" aria-label="Move '+esc(ex.name)+' up"'+(i===0?' disabled':'')+'>'+ic('up')+'</button><button type="button" class="icon-btn" data-act="dxMove" data-i="'+i+'" data-dir="1" aria-label="Move '+esc(ex.name)+' down"'+(i===n-1?' disabled':'')+'>'+ic('down')+'</button><button type="button" class="icon-btn dng" data-act="dxDel" data-i="'+i+'" aria-label="Remove '+esc(ex.name)+'">'+ic('trash')+'</button></div></div>';
}
INP.dfield=el=>{const f=el.dataset.f;DRAFT.data[f]=f==='duration'?(num(el.value)||0):el.value};
CHG.dfieldc=el=>{const f=el.dataset.f;DRAFT.data[f]=f==='day'?(el.value===''?null:+el.value):el.value};
CHG.loadTpl=el=>{const t=S.templates.find(x=>x.id===el.value);if(!t)return;
  const d=DRAFT.data;d.exercises=clone(t.exercises).map(e=>Object.assign(e,{id:uid()}));if(!d.name)d.name=t.name;d.muscles=t.muscles.slice();d.duration=t.duration;if(!d.notes)d.notes=t.notes||'';refresh()};
INP.dx=el=>{
  const e=DRAFT.data.exercises[+el.dataset.i];if(!e)return;const f=el.dataset.f,v=num(el.value),t=getEx(e.exId).type;
  if(f==='sets')e.sets=Math.max(1,Math.round(v||1));else if(f==='reps')e.reps=v==null?null:Math.round(v);
  else if(f==='weight')e.weight=v==null||v===0?null:fromDisp('w',v);else if(f==='dur')e.dur=v==null?null:(t==='cardio'?Math.round(v*60):Math.round(v));
  else if(f==='dist')e.dist=v==null||v===0?null:fromDisp('d',v);else if(f==='rest')e.rest=v==null?0:Math.round(v);
};
ACT.useEst=()=>{DRAFT.data.duration=estimateMin(DRAFT.data.exercises);refresh()};

const fmtVol=v=>Math.round(toDisp('w',v)||0).toLocaleString()+' '+uName('w');

/* ---------- REST TIMER ---------- */
const T={ac:null,wl:null,iv:null,
  unlock(){try{if(!this.ac){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ac=new C()}if(this.ac&&this.ac.state==='suspended')this.ac.resume()}catch(e){}},
  beep(){
    if(!S.settings.sound)return;this.unlock();const ac=this.ac;if(!ac)return;
    try{[0,.28,.56].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+d;o.type='sine';o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.25)})}catch(e){}
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  },
  left(){const t=S.timer;return t.status==='running'?Math.max(0,Math.ceil((t.endsAt-Date.now())/1000)):t.remain},
  start(sec){this.unlock();const t=S.timer;sec=Math.max(1,Math.round(sec));t.total=sec;t.remain=sec;t.endsAt=Date.now()+sec*1000;t.status='running';save();this.run();this.lock();this.sync()},
  pause(){const t=S.timer;if(t.status!=='running')return;t.remain=this.left();t.status='paused';save();this.unlockWL();this.sync()},
  resume(){const t=S.timer;if(t.status!=='paused')return;this.unlock();t.endsAt=Date.now()+t.remain*1000;t.status='running';save();this.run();this.lock();this.sync()},
  reset(){const t=S.timer;t.status='idle';t.remain=t.total;t.endsAt=0;save();this.unlockWL();this.sync()},
  setTotal(sec){const t=S.timer;t.total=sec;t.remain=sec;t.status='idle';t.endsAt=0;save();this.sync()},
  add(sec){const t=S.timer;if(t.status==='running'){t.endsAt+=sec*1000;t.total+=sec}else{t.remain+=sec;t.total+=sec;if(t.status==='done'){t.status='paused'}}save();this.sync()},
  run(){clearInterval(this.iv);this.iv=setInterval(()=>this.step(),250)},
  step(){const t=S.timer;if(t.status!=='running'){clearInterval(this.iv);return}
    if(this.left()<=0){this.finish(true)}else this.ui()},
  finish(alert){const t=S.timer;clearInterval(this.iv);t.status='done';t.remain=0;save();this.unlockWL();
    if(alert){this.beep();toast('Rest finished — ready for the next set','ok');if(document.hidden){const o=document.title;document.title='⏰ Rest over!';const f=()=>{if(!document.hidden){document.title=o;document.removeEventListener('visibilitychange',f)}};document.addEventListener('visibilitychange',f)}}
    this.sync()},
  async lock(){try{if('wakeLock' in navigator&&!this.wl){this.wl=await navigator.wakeLock.request('screen');this.wl.addEventListener('release',()=>{this.wl=null})}}catch(e){}},
  unlockWL(){try{if(this.wl){this.wl.release();this.wl=null}}catch(e){}},
  ui(){
    const l=this.left(),t=S.timer,frac=t.total?clamp(l/t.total,0,1):0;
    $$('[data-tleft]').forEach(e=>{e.textContent=fmtClock(l)});
    $$('[data-tring]').forEach(e=>{const c=+e.getAttribute('data-c');e.setAttribute('stroke-dasharray',(c*frac)+' '+c)});
    const b=$('#timer-btn-t');if(b)b.textContent=t.status==='idle'?'Rest timer':fmtClock(l);
  },
  sync(){renderDock();updatePanel();this.ui()},
  resumeOnLoad(){const t=S.timer;if(t.status==='running'){if(t.endsAt<=Date.now()){t.status='done';t.remain=0}else{this.run();this.lock()}}}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S&&S.timer.status==='running'){if(T.left()<=0)T.finish(true);else{T.run();T.lock();T.ui()}}}});
function renderDock(){
  const d=$('#dock');if(!d||!S)return;const t=S.timer,tb=$('#timer-btn-t');
  if(tb)tb.textContent=t.status==='idle'?'Rest timer':fmtClock(T.left());

  d.innerHTML='<div class="dock" role="timer" aria-label="Rest timer">'+ic('timer')+'<div><div class="tt" data-tleft>'+fmtClock(T.left())+'</div><small>'+(done?'Rest finished':paused?'Paused':'Resting')+'</small></div>'
    +(done?'<button type="button" class="btn" data-act="tReset">Dismiss</button>':'<button type="button" class="btn" data-act="'+(paused?'tResume':'tPause')+'">'+ic(paused?'play':'pause')+(paused?'Resume':'Pause')+'</button><button type="button" class="btn" data-act="tAdd" data-s="15" aria-label="Add 15 seconds">+15s</button><button type="button" class="btn" data-act="tReset" aria-label="Skip rest">'+ic('skip')+'Skip</button>')
    +'<button type="button" class="icon-btn" style="color:#fff" data-act="openTimer" aria-label="Open timer panel">'+ic('timer')+'</button></div>';

function timerPanelHTML(){

   +'<div class="row wrap mt" style="justify-content:center">'+presets.map(s=>'<button type="button" class="chip" data-act="tPreset" data-s="'+s+'" aria-pressed="'+(t.total===s&&st==='idle')+'">'+(s>=120?s/60+' min':s+' sec')+'</button>').join('')+'</div>'
   +'<form data-submit="tCustom" class="row mt" style="justify-content:center"><label class="sr" for="tc">Custom rest time in seconds</label><input id="tc" name="s" type="number" min="5" max="3600" step="1" inputmode="numeric" placeholder="Custom (sec)" style="width:140px"><button class="btn">Set custom</button></form>'
   +'<div class="row mt wrap" style="justify-content:center">'
   +(st==='running'?'<button type="button" class="btn pri lg" data-act="tPause">'+ic('pause')+'Pause</button>':st==='paused'?'<button type="button" class="btn pri lg" data-act="tResume">'+ic('play')+'Resume</button>':'<button type="button" class="btn pri lg" data-act="tStart">'+ic('play')+'Start</button>')
   +'<button type="button" class="btn lg" data-act="tReset"'+(st==='idle'?' disabled':'')+'>'+ic('reset')+'Reset</button></div>'
   +'<label class="row small mt" style="justify-content:center"><input type="checkbox" data-chg="soundToggle"'+(S.settings.sound?' checked':'')+'> Sound alert when time is up</label>'
   +'<p class="hint">The timer follows your device clock, so it stays accurate when you switch tabs. Keep this page open so the alert can sound.</p></div>';
}
function updatePanel(){const p=$('#tpanel');if(p)p.innerHTML=timerPanelHTML()}
ACT.openTimer=()=>{if($('#tpanel'))return;modal({title:'Rest timer',html:'<div class="mb" id="tpanel">'+timerPanelHTML()+'</div><div class="mf"><button type="button" class="btn pri" data-act="closeModal">Close</button></div>'})};
ACT.tStart=()=>T.start(S.timer.total||60);ACT.tPause=()=>T.pause();ACT.tResume=()=>T.resume();ACT.tReset=()=>T.reset();ACT.tAdd=el=>T.add(+el.dataset.s);

CHG.soundToggle=el=>{S.settings.sound=el.checked;save();if(el.checked){T.unlock();T.beep()}};

/* ---------- SESSION ---------- */
ROUTES.session=()=>S.active?sessionView():sessionChooser();
function sessionChooser(){
  const t=today(),d=wd(t),todays=S.plan.filter(w=>w.day===d),others=S.plan.filter(w=>w.day!==d);
  const row=w=>'<div class="li" style="cursor:default"><span class="grow"><b>'+esc(w.name)+'</b><br><span class="small muted">'+(w.day!=null?DAYS[w.day]+' · ':'')+plural(w.exercises.length,'exercise')+' · ~'+w.duration+' min</span></span><button type="button" class="btn pri sm" data-act="startWorkout" data-kind="plan" data-id="'+w.id+'">'+ic('play')+'Start</button></div>';
  let h=pageHead('Start a workout','Pick a planned workout, a template, or start with an empty session and add exercises as you go.','<button type="button" class="btn pri" data-act="startWorkout" data-kind="quick">'+ic('plus')+'Quick workout</button>');
  h+='<div class="grid g2">';
  h+='<div class="card"><h2>Today · '+DAYS[d]+'</h2>'+(todays.length?'<div class="list">'+todays.map(row).join('')+'</div>':emptyState(S.restDays[d]?'Rest day':'Nothing planned today','Pick any workout from the lists, or start a quick session.'))+'</div>';
  h+='<div class="card"><h2>Other planned workouts</h2>'+(others.length?'<div class="list">'+others.map(row).join('')+'</div>':emptyState('No other workouts planned','Create workouts in the Planner.','<a class="btn" href="#/planner">Open planner</a>'))+'</div></div>';
  h+='<div class="card mt"><div class="row between"><h2>From a template</h2><a class="small" href="#/templates">All templates</a></div><div class="list">'+S.templates.slice(0,6).map(w=>'<div class="li" style="cursor:default"><span class="grow"><b>'+esc(w.name)+'</b><br><span class="small muted">'+plural(w.exercises.length,'exercise')+' · ~'+w.duration+' min</span></span><button type="button" class="btn sm" data-act="startWorkout" data-kind="tpl" data-id="'+w.id+'">'+ic('play')+'Start</button></div>').join('')+'</div></div>';
  h+='<p class="small muted mt">'+ic('shield','" style="width:14px;height:14px;vertical-align:-2px')+' Stop if you feel pain, dizziness or unusual symptoms. <button type="button" class="lnk" style="color:var(--accent-d);text-decoration:underline;font-weight:500" data-act="safety">Safety information</button></p>';
  return h;
}
function prevText(last,t){
  if(!last)return '';
  return last.slice(0,4).map(s=>t==='strength'?(s.w>0?fmtNum(toDisp('w',s.w))+' '+uName('w')+' × ':'')+(s.reps||0):t==='bodyweight'?(s.reps||0)+' reps':t==='timed'?fmtSecs(s.dur||0):fmtMin((s.dur||0)/60)+(s.dist?' · '+fmtU('d',s.dist,2):'')).join(', ')+(last.length>4?'…':'');
}
function sessSummary(){
  const A=S.active,st=activeStats(A),pct=st.setsAll?st.sets/st.setsAll*100:0;
  return '<div class="row wrap gap-s mt-s"><span class="chip g">'+st.sets+' / '+st.setsAll+' sets done</span><span class="chip">'+plural(st.total,'exercise')+'</span><span class="chip">'+st.reps+' reps</span>'+(st.vol?'<span class="chip">'+fmtVol(st.vol)+' volume</span>':'')+'</div><div class="mt-s">'+bar(pct)+'</div>';
}
function setRow(e,i,s,j){
  const t=e.type,ud=(f,val,unit,lab,step)=>'<div class="ud"><input type="number" inputmode="decimal" min="0" step="'+(step||'any')+'" data-inp="setf" data-e="'+i+'" data-s="'+j+'" data-f="'+f+'" value="'+esc(val)+'" aria-label="'+lab+' for set '+(j+1)+'"><span>'+unit+'</span></div>';
  let cells='',cls='set';
  if(t==='strength'){cells=ud('w',inVal('w',s.w),uName('w'),'Weight')+ud('reps',s.reps==null?'':s.reps,'reps','Reps','1')}
  else if(t==='bodyweight'){cls='set one';cells=ud('reps',s.reps==null?'':s.reps,'reps','Reps','1')}
  else if(t==='timed'){cls='set one';cells=ud('dur',s.dur==null?'':s.dur,'sec','Seconds','1')}
  else{cells=ud('dur',s.dur==null?'':+(s.dur/60).toFixed(1),'min','Minutes')+ud('dist',inVal('d',s.dist),uName('d'),'Distance')}
  return '<div class="'+cls+'"><span class="sl">Set '+(j+1)+'</span>'+cells+'<button type="button" class="setchk" data-act="toggleSet" data-e="'+i+'" data-s="'+j+'" aria-pressed="'+!!s.done+'" aria-label="Mark set '+(j+1)+' of '+esc(e.name)+' as '+(s.done?'not completed':'completed')+'">'+ic('check')+'</button><button type="button" class="icon-btn dng" data-act="rmSet" data-e="'+i+'" data-s="'+j+'" aria-label="Remove set '+(j+1)+' of '+esc(e.name)+'"'+(e.sets.length<=1?' disabled':'')+'>'+ic('x')+'</button></div>';
}
function sessEx(e,i){
  const t=e.type,hd=t==='strength'?['Weight','Reps']:t==='bodyweight'?['Reps']:t==='timed'?['Seconds']:['Minutes','Distance'];
  const pv=prevText(lastPerf(e.exId),t),dn=e.sets.filter(s=>s.done).length;
  let h='<div class="exc'+(e.skipped?' skipped':'')+(!e.skipped&&dn===e.sets.length&&dn>0?' allsets':'')+'"><div class="row between" style="align-items:flex-start"><div class="grow"><h3><button type="button" class="lnk" data-act="exDetail" data-id="'+e.exId+'">'+(i+1)+'. '+esc(e.name)+'</button></h3>'+(pv?'<div class="small muted">Last time: '+esc(pv)+'</div>':'')+'</div><div class="row gap-s"><button type="button" class="btn sm" data-act="skipEx" data-e="'+i+'" aria-pressed="'+e.skipped+'">'+ic('skip')+(e.skipped?'Unskip':'Skip')+'</button><button type="button" class="icon-btn dng" data-act="rmEx" data-e="'+i+'" aria-label="Remove '+esc(e.name)+' from this workout">'+ic('trash')+'</button></div></div>';
  if(e.skipped)return h+'<p class="small muted">Skipped — this exercise will not be saved.</p></div>';
  h+='<div class="sethead'+(hd.length===1?' one':'')+'"><span>Set</span>'+hd.map(x=>'<span>'+x+'</span>').join('')+'<span>Done</span><span></span></div>'+e.sets.map((s,j)=>setRow(e,i,s,j)).join('');
  h+='<div class="row between wrap mt-s"><button type="button" class="btn sm" data-act="addSet" data-e="'+i+'">'+ic('plus')+'Add set</button><label class="row small muted">Rest <input type="number" min="0" max="900" step="5" inputmode="numeric" data-inp="exrest" data-e="'+i+'" value="'+(e.rest==null?'':e.rest)+'" style="width:74px;min-height:34px;padding:4px 8px" aria-label="Rest seconds for '+esc(e.name)+'"> sec</label></div>';
  h+='<details'+(e.notes?' open':'')+'><summary class="small muted" style="cursor:pointer;margin-top:8px">Exercise notes</summary><textarea data-inp="exnote" data-e="'+i+'" aria-label="Notes for '+esc(e.name)+'" placeholder="How did it feel?" style="min-height:60px">'+esc(e.notes)+'</textarea></details></div>';
  return h;
}
function sessionView(){
  const A=S.active,back=A.date!==today();
  let h='<div class="sess-head"><div class="row between wrap"><div><h1 style="font-size:21px">'+esc(A.name)+'</h1><div class="small muted"><span data-elapsed>'+fmtClock((Date.now()-A.startedAt)/1000)+'</span> elapsed'+(back?' · logging for <b>'+fmtDate(A.date)+'</b>':'')+'</div></div><div class="row wrap gap-s"><button type="button" class="btn" data-act="addSessEx">'+ic('plus')+'Add exercise</button><button type="button" class="btn danger" data-act="cancelWorkout">Cancel</button><button type="button" class="btn pri" data-act="finishWorkout">'+ic('check')+'Finish workout</button></div></div><div id="sess-sum">'+sessSummary()+'</div></div>';
  h+='<div class="stack mt">'+(A.exercises.length?A.exercises.map(sessEx).join(''):'<div class="card">'+emptyState('No exercises yet','Add the first exercise to start logging sets.','<button type="button" class="btn pri" data-act="addSessEx">'+ic('plus')+'Add exercise</button>')+'</div>')+'</div>';
  h+='<div class="disc mt">Planning and tracking tool only — not medical advice. Stop if you feel pain, dizziness or unusual symptoms. <button type="button" class="lnk" style="text-decoration:underline" data-act="safety">Safety information</button></div>';
  return h;
}
const updateSessSummary=()=>{const e=$('#sess-sum');if(e&&S.active)e.innerHTML=sessSummary()};
INP.setf=el=>{
  const A=S.active,e=A.exercises[+el.dataset.e],s=e.sets[+el.dataset.s],f=el.dataset.f,v=num(el.value);
  if(f==='w')s.w=v==null||v===0?null:fromDisp('w',v);else if(f==='reps')s.reps=v==null?null:Math.round(v);
  else if(f==='dur')s.dur=v==null?null:(e.type==='cardio'?Math.round(v*60):Math.round(v));else if(f==='dist')s.dist=v==null||v===0?null:fromDisp('d',v);
  el.classList.remove('bad');save();updateSessSummary();
};
INP.exrest=el=>{S.active.exercises[+el.dataset.e].rest=Math.max(0,Math.round(num(el.value)||0));save()};
INP.exnote=el=>{S.active.exercises[+el.dataset.e].notes=el.value;save()};
ACT.toggleSet=el=>{
  const A=S.active,i=+el.dataset.e,j=+el.dataset.s,e=A.exercises[i],s=e.sets[j];
  if(!s.done){
    const ok=isRepsType(e.type)?(s.reps>0):e.type==='timed'?(s.dur>0):(s.dur>0||s.dist>0);
    if(!ok){toast(isRepsType(e.type)?'Enter the number of reps first.':e.type==='timed'?'Enter the duration in seconds first.':'Enter the minutes or distance first.','err');
      const inp=$('[data-inp="setf"][data-e="'+i+'"][data-s="'+j+'"][data-f="'+(isRepsType(e.type)?'reps':'dur')+'"]');if(inp){inp.classList.add('bad');inp.focus()}return}
  }
  s.done=!s.done;save();
  if(s.done&&S.settings.autoRest&&e.rest>0){const rest=A.exercises.some(x=>!x.skipped&&x.sets.some(y=>!y.done));if(rest)T.start(e.rest)}
  refresh();const b=$('[data-act="toggleSet"][data-e="'+i+'"][data-s="'+j+'"]');if(b)b.focus({preventScroll:true});
};
ACT.addSet=el=>{const e=S.active.exercises[+el.dataset.e],l=e.sets[e.sets.length-1],n=Object.assign({},l||{w:null,reps:null,dur:null,dist:null});n.done=false;e.sets.push(n);save();refresh()};
ACT.rmSet=el=>{const e=S.active.exercises[+el.dataset.e];if(e.sets.length<=1)return;e.sets.splice(+el.dataset.s,1);save();refresh()};
ACT.skipEx=el=>{const e=S.active.exercises[+el.dataset.e];e.skipped=!e.skipped;save();refresh()};
ACT.rmEx=async el=>{const e=S.active.exercises[+el.dataset.e];
  if(e.sets.some(s=>s.done)&&!await confirmDlg({title:'Remove exercise?',msg:'“'+e.name+'” has completed sets that will be lost.',ok:'Remove',danger:true}))return;
  S.active.exercises.splice(+el.dataset.e,1);save();refresh()};
ACT.addSessEx=()=>openPicker(id=>{S.active.exercises.push(buildSession({exercises:[planEx(id)]}).exercises[0]);save();refresh()},()=>S.active.exercises.map(e=>e.exId));
ACT.cancelWorkout=async()=>{
  if(await confirmDlg({title:'Cancel this workout?',msg:'Nothing from this session will be saved. This cannot be undone.',ok:'Cancel workout',cancel:'Keep training',danger:true})){S.active=null;T.reset();save();go('dashboard');toast('Workout cancelled')}
};
ACT.finishWorkout=()=>{
  const A=S.active,st=activeStats(A),el=Math.max(1,Math.round((Date.now()-A.startedAt)/60000));
  if(!st.sets){modal({title:'No sets completed yet',html:'<div class="mb"><p>You have not marked any sets as completed, so there is nothing to save. Mark sets as done as you finish them, or discard this workout.</p></div><div class="mf"><button type="button" class="btn danger" data-act="discardFromFinish">Discard workout</button><button type="button" class="btn pri" data-act="closeModal" autofocus>Keep training</button></div>'});return}
  modal({title:'Finish workout',html:'<form data-submit="finishSession"><div class="mb"><div class="grid g2" style="gap:10px"><div class="card flat stat" style="padding:10px 14px"><div class="l">Exercises</div><div class="v">'+st.exs+'</div></div><div class="card flat stat" style="padding:10px 14px"><div class="l">Sets completed</div><div class="v">'+st.sets+'<small> / '+st.setsAll+'</small></div></div><div class="card flat stat" style="padding:10px 14px"><div class="l">Total reps</div><div class="v">'+st.reps+'</div></div><div class="card flat stat" style="padding:10px 14px"><div class="l">Training volume</div><div class="v" style="font-size:20px">'+(st.vol?fmtVol(st.vol):'–')+'</div></div></div>'
   +'<div class="field mt"><label class="f" for="fd">Workout duration (minutes)</label><input id="fd" name="duration" type="number" min="1" max="600" step="1" inputmode="numeric" required value="'+(A.date===today()?el:Math.max(1,S.profile.duration||30))+'"><div class="hint">'+(A.date===today()?'Calculated from when you started. Adjust it if you took a long break.':'Estimate how long this workout took.')+'</div></div>'
   +'<div class="field"><label class="f" for="fn">Workout notes</label><textarea id="fn" name="notes" maxlength="600" placeholder="Optional: how did it go?">'+esc(A.notes||'')+'</textarea></div><p class="small muted">Sets you did not mark as completed are not saved.</p></div><div class="mf"><button type="button" class="btn" data-act="closeModal">Keep training</button><button class="btn pri" autofocus>Save workout</button></div></form>'});
};
ACT.discardFromFinish=()=>{closeModal();S.active=null;T.reset();save();go('dashboard')};
SUB.finishSession=(f,fd)=>{
  const A=S.active,dur=Math.round(num(fd.get('duration'))||0);if(dur<1||dur>600){toast('Enter a duration between 1 and 600 minutes.','err');return}
  const before=new Set(computePRs().events.map(x=>x.exId+'|'+x.date+'|'+x.sessionId));
  const rec={id:A.id,workoutId:A.workoutId,name:A.name,muscles:A.muscles,startedAt:A.startedAt,date:A.date,duration:dur,notes:String(fd.get('notes')||'').trim(),
    exercises:A.exercises.filter(e=>!e.skipped&&e.sets.some(s=>s.done)).map(e=>({exId:e.exId,name:e.name,type:e.type,skipped:false,notes:e.notes,rest:e.rest,sets:e.sets.filter(s=>s.done).map(s=>Object.assign({},s))}))};
  S.sessions.push(rec);sortSessions();S.active=null;T.reset();syncAuto();save();
  const st=sessStats(rec),newPR=computePRs().events.filter(e=>e.sessionId===rec.id);
  closeAllModals();
  modal({title:'Workout complete',onClose:()=>go('dashboard'),html:'<div class="mb center"><div style="font-size:15px" class="muted">'+esc(rec.name)+'</div><div class="grid g2 mt" style="gap:10px"><div class="card flat stat"><div class="l">Duration</div><div class="v">'+fmtMin(dur)+'</div></div><div class="card flat stat"><div class="l">Sets</div><div class="v">'+st.sets+'</div></div><div class="card flat stat"><div class="l">Reps</div><div class="v">'+st.reps+'</div></div><div class="card flat stat"><div class="l">Volume</div><div class="v" style="font-size:20px">'+(st.vol?fmtVol(st.vol):'–')+'</div></div></div>'
   +(newPR.length?'<div class="banner info mt" style="justify-content:center">'+ic('star')+'<div><b>'+plural(newPR.length,'new personal record')+'</b><br>'+newPR.map(p=>esc(p.name)+': '+esc(p.text)).join('<br>')+'</div></div>':'')+'<p class="muted mt">Nice work. Rest and recover well.</p></div><div class="mf"><button type="button" class="btn pri" data-act="closeModal" autofocus>Done</button></div>'});
};

/* ---------- HISTORY ---------- */
const HF={q:'',m:'',from:'',to:'',shown:25};
function histFiltered(){
  const q=HF.q.trim().toLowerCase();
  return S.sessions.filter(s=>(!q||(s.name+' '+(s.notes||'')+' '+s.exercises.map(e=>e.name).join(' ')).toLowerCase().includes(q))&&(!HF.m||(s.muscles||[]).includes(HF.m)||s.exercises.some(e=>getEx(e.exId).muscle===HF.m))&&(!HF.from||s.date>=HF.from)&&(!HF.to||s.date<=HF.to)).slice().reverse();
}
function histList(){
  const l=histFiltered(),shown=l.slice(0,HF.shown);
  if(!S.sessions.length)return emptyState('No workouts in your history yet','Completed workouts appear here automatically.','<a class="btn pri" href="#/session">Start a workout</a>');
  if(!l.length)return emptyState('No workouts match','Try changing the search or date range.','<button type="button" class="btn" data-act="histClear">Clear filters</button>');
  return '<p class="small muted" aria-live="polite">'+plural(l.length,'workout')+'</p><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Workout</th><th>Duration</th><th>Exercises</th><th>Sets</th><th>Volume</th><th><span class="sr">Actions</span></th></tr></thead><tbody>'
   +shown.map(s=>{const st=sessStats(s);return '<tr><td style="white-space:nowrap">'+fmtDate(s.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</td><td><b>'+esc(s.name)+'</b>'+(s.notes?'<div class="xs muted">'+esc(s.notes.slice(0,70))+(s.notes.length>70?'…':'')+'</div>':'')+'</td><td>'+fmtMin(s.duration)+'</td><td>'+st.exs+'</td><td>'+st.sets+'</td><td>'+(st.vol?fmtVol(st.vol):'–')+'</td><td style="text-align:right;white-space:nowrap"><button type="button" class="btn sm" data-act="viewSession" data-id="'+s.id+'">Details</button> <button type="button" class="icon-btn dng" data-act="delSession" data-id="'+s.id+'" aria-label="Delete '+esc(s.name)+' on '+fmtDate(s.date)+'">'+ic('trash')+'</button></td></tr>'}).join('')+'</tbody></table></div>'

const CAL={view:'month',anchor:today(),sel:today()};
function dayTags(di){
  let t='';
  if(di.done.length)t+='<span class="tag done">✓ '+esc(di.done.length>1?di.done.length+' workouts':di.done[0].name)+'</span>';
  else if(di.missed)t+='<span class="tag miss">Missed</span>';
  else if(di.sched.length)t+='<span class="tag sch">'+esc(di.sched.length>1?di.sched.length+' planned':di.sched[0].name)+'</span>';
  else if(di.rest)t+='<span class="tag rest">Rest</span>';
  if(di.ms.length)t+='<span class="tag ms">★ '+(di.ms.length>1?di.ms.length:'Milestone')+'</span>';
  return '<span class="tags">'+t+'</span>';
}
function dayLabel(di){
  const p=[];if(di.done.length)p.push(plural(di.done.length,'workout')+' completed');if(di.missed)p.push('missed workout');if(!di.done.length&&di.sched.length&&!di.missed)p.push('scheduled: '+di.sched.map(w=>w.name).join(', '));if(di.rest&&!di.sched.length&&!di.done.length)p.push('rest day');if(di.ms.length)p.push(plural(di.ms.length,'milestone'));

}
function calDayPanel(k){
  const di=dayInfo(k),t=today();

  if(di.done.length)h+='<h4 class="mt-s">Completed</h4><div class="list">'+di.done.map(s=>sessionRow(s)).join('')+'</div>';
  if(di.sched.length)h+='<h4 class="mt">'+(k<t?'Scheduled':'Scheduled workouts')+'</h4><div class="list">'+di.sched.map(w=>{const done=di.done.some(s=>s.workoutId===w.id);
    return '<div class="li" style="cursor:default"><span class="grow"><b>'+esc(w.name)+'</b><br><span class="small muted">'+plural(w.exercises.length,'exercise')+' · ~'+w.duration+' min'+(done?' · completed':di.missed?' · missed':'')+'</span></span>'+(k<=t&&!done?'<button type="button" class="btn sm '+(k===t?'pri':'')+'" data-act="startWorkout" data-kind="plan" data-id="'+w.id+'" data-date="'+k+'">'+ic('play')+(k===t?'Start':'Log this workout')+'</button>':'')+'</div>'}).join('')+'</div>';

    +[['Workouts done',ml.length],['Active days',new Set(ml.map(s=>s.date)).size],['Training time',fmtMin(minutesOf(ml))],['Planned days',sched],['Missed',missed],['Completion',sched?Math.round(hit/sched*100)+'%':'–']].map(x=>'<div class="card flat stat" style="padding:10px 14px"><div class="l">'+x[0]+'</div><div class="v" style="font-size:21px">'+x[1]+'</div></div>').join('')+'</div></div>';
  h=pageHead('Fitness Calendar','Click a day to see its details.','<div class="tabs" role="group" aria-label="Calendar view"><button type="button" data-act="calView" data-v="month" aria-pressed="'+(CAL.view==='month')+'">Month</button><button type="button" data-act="calView" data-v="week" aria-pressed="'+(CAL.view==='week')+'">Week</button></div>');
  h+='<div class="row between wrap mb"><div class="row"><button type="button" class="icon-btn" data-act="calNav" data-d="-1" aria-label="Previous '+CAL.view+'">'+ic('chevL')+'</button><h2 style="min-width:190px;text-align:center" aria-live="polite">'+title+'</h2><button type="button" class="icon-btn" data-act="calNav" data-d="1" aria-label="Next '+CAL.view+'">'+ic('chevR')+'</button></div><button type="button" class="btn sm" data-act="calToday">Today</button></div>';
  h+='<div class="grid g-dash"><div class="card">'+body+'<div class="key mt"><span><span class="tag done">✓</span> Completed</span><span><span class="tag sch">Plan</span> Scheduled</span><span><span class="tag rest">Rest</span> Rest day</span><span><span class="tag miss">Missed</span></span><span><span class="tag ms">★</span> Milestone</span></div></div><div class="stack">'+calDayPanel(CAL.sel)+stats+'</div></div>';
  return h;
